name: Test tap-luma

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    - name: Ruff lint
      run: uvx ruff check .
    - name: Ruff format check
      run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Run tests
      env:
        TAP_LUMA_API_KEY: ${{ secrets.TAP_LUMA_API_KEY }}
      run: uv run --group test pytest
